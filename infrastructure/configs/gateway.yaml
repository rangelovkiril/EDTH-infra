apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edth
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: mqtts
      protocol: TCP
      port: 8883
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
