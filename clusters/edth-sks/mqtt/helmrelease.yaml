apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
  namespace: mqtt
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: emqx
    namespace: mqtt
  values:
    replicaCount: 1
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
