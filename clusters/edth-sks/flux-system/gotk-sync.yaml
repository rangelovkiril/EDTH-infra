---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  provider: github
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/rangelovkiril/EDTH-infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m0s
  path: ./clusters/edth-sks
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
