apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: video-relay
  namespace: miget
spec:
  parentRefs:
    - name: edth
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - video.rangelov.dev
  rules:
    - backendRefs:
        - name: video-relay
          port: 8080
      timeouts:
        request: 0s
