apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - fusion-mqtt.sops.yaml
  - namespace.yaml
  - fusion-deployment.yaml
  - relay-deployment.yaml
  - relay-service.yaml
  - httproute.yaml
configMapGenerator:
  - name: video-relay
    namespace: miget
    files:
      - relay.py
generatorOptions:
  disableNameSuffixHash: true
