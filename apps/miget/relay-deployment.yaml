apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-relay
  namespace: miget
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-relay
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/rangelovkiril/edth-fusion:sha-13779be
          command: ["python", "/relay/relay.py"]
          env:
            - name: PUSH_TOKENS
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: relay
              mountPath: /relay
              readOnly: true
      volumes:
        - name: relay
          configMap:
            name: video-relay
