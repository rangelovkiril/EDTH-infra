apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: grafana
spec:
  version: 13.2.4
  config:
    log:
      mode: console
    server:
      root_url: https://grafana.rangelov.dev
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
    users:
      default_theme: dark
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_PLUGINS_PREINSTALL_SYNC
                  value: grafana-mqtt-datasource@1.3.8
