apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - grafana.yaml
  - datasource.yaml
  - dashboard.yaml
  - httproute.yaml
configMapGenerator:
  - name: grafana-dashboard-miget
    namespace: grafana
    files:
      - dashboards/miget.json
generatorOptions:
  disableNameSuffixHash: true
