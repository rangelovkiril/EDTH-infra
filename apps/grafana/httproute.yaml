apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  parentRefs:
    - name: edth
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.rangelov.dev
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
      timeouts:
        request: 0s
