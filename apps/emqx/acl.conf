{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.
{allow, {clientid, {re, "^fusion"}}, subscribe, ["fixes/+"]}.
{allow, {clientid, {re, "^fusion"}}, publish, ["fusion/tracks"]}.
{allow, {username, "node"}, publish, ["nodes/${clientid}/#"]}.
{allow, {username, "node"}, subscribe, ["rays/+"]}.
{deny, {username, "node"}, all, ["#"]}.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.
{allow, all}.
