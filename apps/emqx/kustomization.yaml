apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmchart.yaml
  - helmrelease.yaml
  - loadbalancer.yaml
  - tcproute.yaml
  - httproute.yaml
  - certificate.yaml
  - emqx-users.sops.yaml
  - emqx-secrets.sops.yaml
configMapGenerator:
  - name: emqx-rules
    namespace: emqx
    files:
      - base.hocon
generatorOptions:
  disableNameSuffixHash: true
