apiVersion: v1
kind: Service
metadata:
  name: emqx-nlb
  namespace: emqx
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/instance: emqx
  ports:
    - name: mqtts
      protocol: TCP
      port: 8883
      targetPort: 8883
      nodePort: 31884
    - name: dashboard
      protocol: TCP
      port: 443
      targetPort: 18084
      nodePort: 31885
