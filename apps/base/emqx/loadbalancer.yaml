apiVersion: v1
kind: Service
metadata:
  name: emqx-nlb
  namespace: emqx
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/instance: emqx
  ports:
    - name: mqtt
      protocol: TCP
      port: 1883
      targetPort: 1883
      nodePort: 31883
    - name: mqtts
      protocol: TCP
      port: 8883
      targetPort: 8883
      nodePort: 31884
